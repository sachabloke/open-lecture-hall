<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecture Campus</title>
<meta name="description" content="Walk a night-time street of universities, open a door and watch every free lecture tumble out.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* A night street of universities drawn on one canvas; a small heads-up bar and a player sit on top. */
:root {
  --night: #0b1030; --ink: #eef1fb; --muted: #a9b2d6; --chalk: #f3c64d; --panel: rgba(16, 21, 48, .86);
  --line: rgba(255, 255, 255, .16);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: -apple-system, "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font: 15px/1.4 var(--body); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.point { cursor: pointer; }
canvas.grabbing { cursor: grabbing; }
.hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 12px 16px; align-items: flex-start; flex-wrap: wrap;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 26px max(16px, env(safe-area-inset-left));
  background: linear-gradient(rgba(11, 16, 48, .92), rgba(11, 16, 48, .55) 62%, transparent); pointer-events: none; }
.hud > * { pointer-events: auto; }
.where { flex: 1 1 260px; min-width: 0; pointer-events: none; }
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--chalk); margin: 0 0 6px; }
h1 { font: 800 clamp(20px, 3.4vw, 34px)/1.08 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#sub { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
#sub a { color: var(--chalk); pointer-events: auto; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, .btn, input { font: 600 14px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 14px; text-decoration: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
button { cursor: pointer; }
button:hover, .btn:hover { border-color: var(--chalk); }
button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
#more { background: var(--chalk); color: #1b1430; border-color: transparent; }
input { width: min(250px, 62vw); font-weight: 500; }
input::placeholder { color: var(--muted); }
#hint { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); margin: 0; text-align: center;
  font-size: 13px; pointer-events: none; transition: opacity .4s; padding: 0 16px; z-index: 2; }
#hint span { display: inline-block; padding: 7px 14px; border-radius: 999px; background: rgba(11, 16, 48, .82); color: var(--ink); border: 1px solid var(--line); }
#tip { position: fixed; z-index: 3; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: #fff; color: #16213a;
  font-size: 13px; line-height: 1.3; pointer-events: none; box-shadow: 0 6px 24px rgba(0, 0, 0, .45); }
#tip b { display: block; font-weight: 700; }
#tip span { color: #5a6582; }
#player { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: rgba(5, 7, 22, .78); }
#player[hidden], [hidden] { display: none !important; }
.pbox { width: min(920px, 100%); background: #131937; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: 0 24px 80px rgba(0, 0, 0, .6); }
.phead { display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; }
#ptitle { flex: 1; margin: 0; font: 600 16px/1.25 var(--display); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pmedia { background: #000; }
#pmedia iframe, #pmedia video { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 68vh; border: 0; }
#pmedia audio { display: block; width: calc(100% - 32px); margin: 28px 16px; }
#pmedia p { margin: 0; padding: 40px 20px; text-align: center; color: var(--muted); }
.pfoot { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 12px; flex-wrap: wrap; }
.pfoot a { color: var(--chalk); font-weight: 600; font-size: 14px; }
@media (max-width: 560px) { .hud { gap: 8px; } h1 { font-size: 20px; } button, .btn, input { padding: 9px 12px; font-size: 13px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A street of university buildings at night. Use the search box to enter a university, or the list view for a plain list."></canvas>
<header class="hud">
  <button type="button" id="back" hidden>← Back</button>
  <div class="where">
    <p class="eyebrow" id="eyebrow">Open Lecture Hall · Campus</p>
    <h1 id="title">Pick a university. Open its doors.</h1>
    <p id="sub">Lighting the windows…</p>
  </div>
  <div class="tools">
    <form id="go" autocomplete="off"><input id="q" list="unis" placeholder="Enter a university…" aria-label="Enter a university"><datalist id="unis"></datalist></form>
    <button type="button" id="more" hidden>Pour more</button>
    <a class="btn" href="index.html">List view</a>
  </div>
</header>
<p id="hint"><span id="hintText">Drag the street · tap a building to open its doors</span></p>
<div id="tip" hidden></div>
<div id="player" hidden role="dialog" aria-modal="true" aria-label="Lecture player">
  <div class="pbox">
    <div class="phead"><p id="ptitle"></p><button type="button" id="pclose" aria-label="Close player">✕</button></div>
    <div id="pmedia"></div>
    <div class="pfoot"><button type="button" id="pprev">← Previous</button><a id="popen" target="_blank" rel="noopener"></a><button type="button" id="pnext">Next →</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  "use strict";
  const { Engine, Bodies, Body, Composite, Constraint, Query, Sleeping } = Matter;
  const $ = (id) => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DISPLAY = '"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif';
  const BODY = '-apple-system, "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif';
  const LIT = "#ffd27a", DARKWIN = "#161a33", CHALK = "#f3c64d";
  const HUES = [330, 150, 28, 190, 222, 45, 280, 205, 120, 12, 262, 0, 240, 300, 250, 170, 85, 215];
  const SHARDS = 128, GAP = 46;
  let W = 0, H = 0, DPR = 1, T = 0;

  // ---------- small helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  function hash(s) { let h = 5381; for (const ch of s) h = (Math.imul(h, 33) ^ ch.codePointAt(0)) >>> 0; return h; }
  function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");
  const num = (n) => n.toLocaleString();
  function fit(text, maxW) { // shorten text to a pixel width with the current ctx.font
    if (ctx.measureText(text).width <= maxW) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ctx.measureText(text.slice(0, m) + "…").width <= maxW) lo = m; else hi = m - 1; }
    return text.slice(0, lo).trimEnd() + "…";
  }
  function wrap(text, maxW, maxLines) {
    const words = text.split(/\s+/), lines = []; let cur = "";
    for (const w of words) {
      const t = cur ? cur + " " + w : w;
      if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
      if (lines.length === maxLines) break;
    }
    if (lines.length < maxLines && cur) lines.push(cur);
    if (lines.length === maxLines) { const used = lines.join(" ").length; if (used < text.length - 1) lines[maxLines - 1] = fit(lines[maxLines - 1] + " …", maxW); }
    return lines.map((l) => fit(l, maxW));
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

  // ---------- data ----------
  let data = null, unis = [], streetW = 0;
  const shardCache = {};
  function lecturesFor(id) {
    const k = hash(id) % SHARDS;
    shardCache[k] = shardCache[k] || fetch(`lectures/${k}.json`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
    return shardCache[k].then((m) => m[id] || []);
  }
  function media(link) { // "y:ID" YouTube, "a:ident" Internet Archive item, else a full URL
    if (link.startsWith("y:")) { const id = encodeURIComponent(link.slice(2));
      return { open: "https://www.youtube.com/watch?v=" + id, embed: "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0", where: "YouTube" }; }
    if (link.startsWith("a:")) { const id = encodeURIComponent(link.slice(2));
      return { open: "https://archive.org/details/" + id, embed: "https://archive.org/embed/" + id + "?autoplay=1", where: "the Internet Archive" }; }
    const u = safeUrl(link), path = u.split("?")[0].toLowerCase();
    if (/\.(mp3|m4a|aac|ogg|oga|opus|wav)$/.test(path)) return { open: u, audio: u, where: "its own page" };
    if (/\.(mp4|m4v|webm|ogv|mov)$/.test(path)) return { open: u, video: u, where: "its own page" };
    return { open: u, where: "its own page" };
  }

  function styleFor(u) {
    const n = u.name;
    if (u.nLect < 14 && u.courses.length < 3) return "cottage";
    if (/oxford|cambridge|yale|princeton|chicago|edinburgh|duke|toronto|king.s college|trinity|leuven|cornell/i.test(n)) return "gothic";
    if (/\bMIT\b|columbia|caltech|virginia|london|college de france|collège/i.test(n)) return "dome";
    if (/berkeley|stanford|texas|austin|ucla|irvine|davis/i.test(n)) return "campanile";
    if (/harvard|brown|dartmouth|william|college/i.test(n)) return "georgian";
    return ["modern", "modern", "modern", "dome", "georgian", "campanile", "gothic"][hash(n) % 7];
  }

  function init(d) {
    data = d;
    const m = new Map();
    d.rows.forEach((r) => {
      if (!(r[5] & 3)) return; // only courses with video or audio
      const name = d.institutions[r[1]];
      if (/^(unknown|various|multiple|multi-)/i.test(name)) return;
      let u = m.get(name);
      if (!u) m.set(name, u = { name, rank: r[13] || 4, courses: [], nLect: 0 });
      const c = { title: r[0], who: r[2], subj: r[3], year: r[4], bits: r[5], n: r[6] || 0, url: r[7], feed: r[9], lid: r[12] || "" };
      u.courses.push(c); u.nLect += c.n || 1;
    });
    unis = [...m.values()].sort((a, b) => a.rank - b.rank || b.nLect - a.nLect);
    let x = 80;
    for (const u of unis) {
      const r = rng(hash(u.name));
      u.courses.sort((a, b) => (b.lid ? 1 : 0) - (a.lid ? 1 : 0) || b.n - a.n);
      u.style = styleFor(u);
      const small = u.style === "cottage";
      u.w = Math.round(small ? 84 + r() * 22 : 124 + 30 * Math.log10(1 + u.courses.length) + r() * 22);
      u.h = Math.round(small ? 70 + r() * 20 : 92 + 58 * Math.log10(1 + u.nLect) + r() * 18);
      u.doorX = u.style === "campanile" ? u.w * .36 : u.w / 2;
      u.doorW = small ? 16 : u.style === "gothic" ? 26 : 24;
      u.doorH = small ? 28 : u.style === "gothic" ? 44 : 38;
      u.x = x; x += u.w + GAP;
    }
    streetW = x + 40;
    $("unis").innerHTML = unis.map((u) => `<option value="${esc(u.name)}">`).join("");
    cam.x = Math.min(streetW / 2, W / 2 / streetZ());
    toStreet(true);
    const want = decodeURIComponent(location.hash.slice(1));
    const u = want && unis.find((v) => v.name === want);
    if (u) enter(u);
  }

  // ---------- camera and scene state ----------
  const cam = { x: 0, z: 1, gy: 0 };       // world x at screen centre, zoom, screen y of the ground line
  let state = "load";                       // load | street | zoom | hall | book
  let cur = { u: null, start: 0, course: null, lectures: null, lstart: 0, book: null };
  let door = 0, hallMix = 0, panVel = 0, hover = null, hoverBody = null;
  const tweens = [];
  function tween(ms, fn, done) { tweens.push({ t0: performance.now(), ms: reduce ? 1 : ms, fn, done }); }
  const streetZ = () => clamp(H * .6 / 470, .5, 1.25);
  const streetGy = () => Math.round(H * .76);
  const hallDoorH = () => clamp(H * .26, 120, 230);
  const hallGy = () => Math.round(H * .47);
  const sx = (wx) => (wx - cam.x) * cam.z + W / 2;

  let hintTimer = 0;
  function hint(text) { // show a hint, then let it fade so it never sits on the pile
    $("hintText").textContent = text; $("hint").style.opacity = 1;
    clearTimeout(hintTimer); hintTimer = setTimeout(() => { $("hint").style.opacity = 0; }, 6000);
  }
  function setHud(eyebrow, title, sub, back, more) {
    $("eyebrow").textContent = eyebrow; $("title").textContent = title; $("sub").innerHTML = sub;
    $("back").hidden = !back; if (back) $("back").textContent = back;
    $("more").hidden = !more; if (more) $("more").textContent = more;
  }
  function toStreet(first) {
    state = "street"; cur.u = null; door = 0; hallMix = 0; cam.z = streetZ(); cam.gy = streetGy();
    clearBodies(true);
    const total = unis.reduce((s, u) => s + u.nLect, 0);
    setHud("Open Lecture Hall · Campus", "Pick a university. Open its doors.",
      `${num(unis.length)} universities · ${num(total)} free lectures inside`, "", "");
    hint("Drag the street · tap a building to open its doors");
    if (!first) history.replaceState(null, "", location.pathname + location.search);
  }

  function enter(u) {
    if (state !== "street") return;
    state = "zoom"; cur.u = u; cur.start = 0; panVel = 0; hover = null; $("tip").hidden = true;
    $("hint").style.opacity = 0; $("q").value = ""; $("q").blur();
    setHud("Opening the doors of", u.name, "", "", "");
    history.replaceState(null, "", "#" + encodeURIComponent(u.name));
    const x0 = cam.x, z0 = cam.z, g0 = cam.gy, tx = u.x + u.doorX;
    const far = Math.abs(tx - x0) * z0 > W * .45;
    const zoomIn = () => {
      const x1 = cam.x, z1 = hallDoorH() / u.doorH, g1 = hallGy();
      tween(1300, (t) => {
        const e = ease(t);
        cam.z = z0 * Math.pow(z1 / z0, e); cam.x = lerp(x1, tx, easeOut(Math.min(1, t * 1.6))); cam.gy = lerp(g0, g1, e);
        hallMix = e; door = ease(clamp((t - .5) / .5, 0, 1));
      }, () => { state = "hall"; hallHud(); startWorld(); pourBooks(); });
    };
    if (far) tween(clamp(Math.abs(tx - x0) * z0 / 3, 500, 1400), (t) => { cam.x = lerp(x0, tx, ease(t)); }, zoomIn);
    else zoomIn();
  }
  function leaveHall() {
    const u = cur.u, x1 = cam.x, z1 = cam.z, g1 = cam.gy, z0 = streetZ(), g0 = streetGy();
    clearBodies(true); cur.book = null; state = "zoom"; setHud("Open Lecture Hall · Campus", u.name, "", "", "");
    tween(800, (t) => { const e = ease(t); cam.z = z1 * Math.pow(z0 / z1, e); cam.gy = lerp(g1, g0, e); hallMix = 1 - e; door = 1 - e; cam.x = x1; },
      () => toStreet());
  }
  function hallHud() {
    const u = cur.u, cap = bookCap(), a = cur.start + 1, b = Math.min(u.courses.length, cur.start + cap);
    const band = u.rank === 1 ? "World top 25 · " : u.rank === 2 ? "World top 100 · " : "";
    setHud(band + "university", u.name,
      `${num(u.courses.length)} ${u.courses.length === 1 ? "course" : "courses"} · ${num(u.nLect)} lectures` +
      (u.courses.length > cap ? ` · showing ${num(a)}–${num(b)}` : ""),
      "← The street", u.courses.length > cap ? "Pour the next shelf" : "");
    hint("Each book is a course. Tap one to shake out its lectures.");
  }
  function bookHud() {
    const c = cur.course, L = cur.lectures || [], cap = cardCap();
    const bits = [];
    if (c.who) bits.push(esc(c.who));
    if (L.length) bits.push(`${num(L.length)} ${c.bits & 1 ? "lectures" : "recordings"}` + (L.length > cap ? ` · showing ${cur.lstart + 1}–${Math.min(L.length, cur.lstart + cap)}` : ""));
    bits.push(`<a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">Course page ↗</a>`);
    setHud(cur.u.name, c.title, bits.join(" · "), "← All courses", L.length > cap ? "More lectures" : "");
    hint(L.length ? "Tap a lecture to play it" : "This course keeps its lectures on its own page");
  }

  // ---------- physics ----------
  let engine = null, walls = [], bodies = [], spawnQ = [], drag = null;
  function startWorld() {
    engine = Engine.create({ enableSleeping: true });
    engine.gravity.y = 1;
    walls = [Bodies.rectangle(0, 0, 10, 10, { isStatic: true }), Bodies.rectangle(0, 0, 10, 10, { isStatic: true }), Bodies.rectangle(0, 0, 10, 10, { isStatic: true })];
    Composite.add(engine.world, walls); placeWalls();
  }
  function placeWalls() {
    if (!engine) return;
    const set = (b, x, y, w, h) => { Body.setVertices(b, [{ x: x - w / 2, y: y - h / 2 }, { x: x + w / 2, y: y - h / 2 }, { x: x + w / 2, y: y + h / 2 }, { x: x - w / 2, y: y + h / 2 }]); Body.setPosition(b, { x, y }); };
    set(walls[0], W / 2, H + 60, W * 3, 120); set(walls[1], -60, H / 2 - H, 120, H * 5); set(walls[2], W + 60, H / 2 - H, 120, H * 5);
    bodies.forEach((b) => Sleeping.set(b, false));
  }
  function clearBodies(all) {
    spawnQ = []; drag = null; hoverBody = null;
    if (!engine) return;
    bodies.forEach((b) => Composite.remove(engine.world, b)); bodies = [];
    if (all) engine = null;
  }
  const bookCap = () => clamp(Math.floor(.27 * W * H / (140 * 30)), 12, 70);
  const cardCap = () => clamp(Math.floor(.36 * W * (H - bookY()) / (104 * 50)), 10, 70);
  const bookY = () => Math.max(170, H * .3);

  function pourBooks() {
    const u = cur.u, list = u.courses.slice(cur.start, cur.start + bookCap());
    clearBodies(false);
    list.forEach((c, i) => spawnQ.push({ at: T + 250 + i * 55, kind: "book", c }));
  }
  function spawn(q) {
    const r = Math.random, small = W < 560;
    if (q.kind === "book") {
      const c = q.c;
      ctx.font = `600 11px ${BODY}`;
      const w = clamp(ctx.measureText(c.title).width + 34, 84, small ? 150 : 196), h = 24 + Math.min(14, Math.sqrt(c.n || 1) * 1.5);
      const dw = cur.u.doorW * cam.z;
      const b = Bodies.rectangle(W / 2 + (r() - .5) * dw * .5, cam.gy - hallDoorH() * .45, w, h, { chamfer: { radius: 4 }, restitution: .22, friction: .7, frictionAir: .012, density: .002 });
      Body.setAngle(b, (r() - .5) * 1.2);
      Body.setVelocity(b, { x: (r() - .5) * 2 * (5 + W / 150), y: -(3 + r() * 7) });
      Body.setAngularVelocity(b, (r() - .5) * .3);
      b.item = { kind: "book", c, w, h, hue: HUES[c.subj % HUES.length], label: fit(c.title, w - 28) };
      bodies.push(b); Composite.add(engine.world, b);
    } else {
      const bk = cur.book, w = 104, h = 50;
      const b = Bodies.rectangle(bk.x + (r() - .5) * bk.w * .5, bk.y + bk.w * .14, w, h, { chamfer: { radius: 5 }, restitution: .25, friction: .6, frictionAir: .02, density: .0012 });
      Body.setAngle(b, (r() - .5) * 1.4);
      Body.setVelocity(b, { x: (r() - .5) * 2 * (3 + W / 260), y: 1 + r() * 3 });
      Body.setAngularVelocity(b, (r() - .5) * .35);
      ctx.font = `600 10.5px ${BODY}`;
      b.item = { kind: "card", i: q.i, w, h, lines: wrap(q.title, w - 16, 2), tag: q.tag, played: false, gold: q.gold };
      bodies.push(b); Composite.add(engine.world, b);
    }
  }

  function openBook(body) {
    const it = body.item, c = it.c;
    state = "book"; cur.course = c; cur.lectures = null; cur.lstart = 0; $("tip").hidden = true; hoverBody = null;
    if (drag) { Composite.remove(engine.world, drag.c); drag = null; }
    spawnQ = [];
    Composite.remove(engine.world, body); bodies = bodies.filter((b) => b !== body);
    // the floor opens under every other book
    bodies.forEach((b) => { b.collisionFilter.mask = 0; b.item.falling = true; Sleeping.set(b, false); Body.setVelocity(b, { x: (Math.random() - .5) * 6, y: -2 - Math.random() * 3 }); });

      const bh = h * .58;
      R(0, -bh, w, bh, "#5c4c62"); R(w * .86, -bh, w * .14, bh, "#4b3d51");
      tri(-6, -bh, w / 2, -h, w + 6, -bh, "#8a4444"); R(w * .68, -h * .9, 8, h * .2, "#4b3d51");
      win(r, w * .14, -bh + 12, 12, 12, false); win(r, w * .86 - 12, -bh + 12, 12, 12, false);
    }
    if (u.rank === 1 && u.style !== "cottage") { // gold pennant for the world top 25
      const fy = -h - (u.style === "modern" ? 14 : 6), wave = reduce ? 0 : Math.sin(T / 300 + u.x) * 2;
      R(topX - .6, fy - 16, 1.2, 16, "#e9e4f2");
      ctx.fillStyle = CHALK; ctx.beginPath(); ctx.moveTo(topX + .6, fy - 16); ctx.lineTo(topX + 15, fy - 12 + wave); ctx.lineTo(topX + .6, fy - 8); ctx.fill();
    }
    drawDoor(u, lit);
  }
  function drawDoor(u, glow) {
    const x = u.doorX - u.doorW / 2, w = u.doorW, h = u.doorH, open = u === cur.u ? door : 0;
    const arch = u.style === "gothic" ? 2 : (u.style === "modern" || u.style === "cottage") ? 0 : 1;
    const path = () => { ctx.beginPath(); ctx.moveTo(x, 0);
      if (arch === 2) { ctx.lineTo(x, -h * .6); ctx.quadraticCurveTo(x, -h * .92, x + w / 2, -h); ctx.quadraticCurveTo(x + w, -h * .92, x + w, -h * .6); }
      else if (arch === 1) { ctx.lineTo(x, -h + w / 2); ctx.arc(x + w / 2, -h + w / 2, w / 2, Math.PI, 0); }
      else { ctx.lineTo(x, -h); ctx.lineTo(x + w, -h); }
      ctx.lineTo(x + w, 0); ctx.closePath(); };
    if (glow || open) { const g = ctx.createRadialGradient(x + w / 2, -h / 2, 2, x + w / 2, -h / 2, h * (1.1 + open));
      g.addColorStop(0, `rgba(255,205,120,${.35 + open * .35})`); g.addColorStop(1, "rgba(255,205,120,0)"); ctx.fillStyle = g; ctx.fillRect(x - h * 2, -h * 2.6, w + h * 4, h * 3.4); }
    ctx.save(); path(); ctx.clip();
    const g = ctx.createLinearGradient(0, -h, 0, 0); g.addColorStop(0, "#fff6d8"); g.addColorStop(1, "#ffbe62");
    ctx.fillStyle = g; ctx.fillRect(x, -h, w, h);
    const lw = (w / 2) * (1 - open * .86), glass = arch === 0 && u.style === "modern";
    ctx.fillStyle = glass ? "#35508a" : "#3b2416"; ctx.fillRect(x, -h, lw, h); ctx.fillRect(x + w - lw, -h, lw, h);
    ctx.fillStyle = glass ? "rgba(169,214,255,.35)" : "#56351f";
    if (lw > 3) { ctx.fillRect(x + lw * .18, -h * .86, lw * .64, h * .36); ctx.fillRect(x + lw * .18, -h * .42, lw * .64, h * .34);
      ctx.fillRect(x + w - lw * .82, -h * .86, lw * .64, h * .36); ctx.fillRect(x + w - lw * .82, -h * .42, lw * .64, h * .34); }
    ctx.fillStyle = CHALK; ctx.fillRect(x + lw - 2, -h * .46, 1.2, 2.4); ctx.fillRect(x + w - lw + .8, -h * .46, 1.2, 2.4);
    ctx.restore();
    ctx.strokeStyle = glow && !open ? CHALK : "rgba(20,16,40,.7)"; ctx.lineWidth = glow && !open ? 1.6 : 1.2; path(); ctx.stroke();
  }

  function drawStreet() {
    const z = cam.z, gy = cam.gy, left = cam.x - W / 2 / z - 40, right = cam.x + W / 2 / z + 40;
    drawBackRow();
    // ground
    const gg = ctx.createLinearGradient(0, gy, 0, H); gg.addColorStop(0, "#1c1f3a"); gg.addColorStop(1, "#0c0e1f");
    ctx.fillStyle = gg; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = "#2c3157"; ctx.fillRect(0, gy, W, Math.max(2, 4 * z));
    ctx.save(); ctx.translate(W / 2 - cam.x * z, gy); ctx.scale(z, z);
    for (const u of unis) {
      if (u.x + u.w < left || u.x > right) continue;
      const lit = u === hover || u === cur.u;
      ctx.save(); ctx.translate(u.x, 0); drawBuilding(u, lit); ctx.restore();
      // lamp in the gap after each building
      const lx = u.x + u.w + GAP / 2;
      R(lx - .8, -46, 1.6, 46, "#2a2e52"); R(lx - 4, -47, 8, 2, "#2a2e52");
      const lg = ctx.createRadialGradient(lx, -44, 1, lx, -44, 34); lg.addColorStop(0, "rgba(255,214,140,.55)"); lg.addColorStop(1, "rgba(255,214,140,0)");
      ctx.fillStyle = lg; ctx.fillRect(lx - 34, -78, 68, 68);
      ctx.fillStyle = "#ffe7b0"; ctx.beginPath(); ctx.arc(lx, -44, 2.4, 0, 6.3); ctx.fill();
      // name plate
      if (hallMix < .5) {
        ctx.globalAlpha = 1 - hallMix * 2; ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.font = `800 13px ${DISPLAY}`; ctx.fillStyle = lit ? CHALK : "#eef1fb";
        const lines = wrap(u.name, u.w + GAP - 10, 2);
        lines.forEach((l, i) => ctx.fillText(l, u.x + u.w / 2, 12 + i * 15));
        ctx.font = `500 10.5px ${BODY}`; ctx.fillStyle = "#a9b2d6";
        ctx.fillText(`${num(u.nLect)} lectures`, u.x + u.w / 2, 14 + lines.length * 15);
        if (lit && state === "street") { ctx.font = `700 10.5px ${BODY}`; ctx.fillStyle = CHALK; ctx.fillText("Open the doors ▸", u.x + u.w / 2, 29 + lines.length * 15); }
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }
  function drawSteps() { // the plaza in front of the open door, seen close up
    if (hallMix <= 0) return;
    const u = cur.u, top = cam.gy, dwS = u.doorW * cam.z, n = 7, cx = sx(u.x + u.doorX);
    ctx.globalAlpha = hallMix;
    ctx.fillStyle = "#12152b"; ctx.fillRect(0, top, W, H - top);
    for (let i = 0; i < n; i++) {
      const y0 = top + (H - top) * Math.pow(i / n, 1.25), y1 = top + (H - top) * Math.pow((i + 1) / n, 1.25);
      const half = dwS * 1.1 + (Math.max(W * .62, dwS * 3) - dwS * 1.1) * ((i + 1) / n);
      const c = 34 + i * 5;
      ctx.fillStyle = `rgb(${c + 6},${c + 10},${c + 40})`; ctx.fillRect(cx - half, y0, half * 2, y1 - y0);
      ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(cx - half, y1 - Math.max(3, (y1 - y0) * .22), half * 2, Math.max(3, (y1 - y0) * .22));
    }
    ctx.globalAlpha = 1;
    if (door > 0) { // light spilling down the steps
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createLinearGradient(0, top, 0, H); g.addColorStop(0, `rgba(255,196,110,${.42 * door})`); g.addColorStop(1, "rgba(255,196,110,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx - dwS / 2, top); ctx.lineTo(cx + dwS / 2, top); ctx.lineTo(cx + dwS * 2.6, H); ctx.lineTo(cx - dwS * 2.6, H); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }

  // ---------- drawing: books, cards, the open book ----------
  function drawBody(b) {
    const it = b.item, w = it.w, h = it.h, hot = b === hoverBody || (drag && drag.body === b);
    ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
    ctx.fillStyle = "rgba(0,0,0,.28)"; rr(-w / 2 + 2, -h / 2 + 3, w, h, 5); ctx.fill();
    const flip = Math.cos(b.angle) < 0; if (flip) ctx.rotate(Math.PI);
    if (it.kind === "book") {
      ctx.fillStyle = `hsl(${it.hue} 44% 40%)`; rr(-w / 2, -h / 2, w, h, 4); ctx.fill();
      ctx.fillStyle = `hsl(${it.hue} 46% 28%)`; ctx.fillRect(-w / 2 + 6, -h / 2, 5, h); ctx.fillRect(w / 2 - 11, -h / 2, 5, h);
      ctx.fillStyle = "rgba(243,198,77,.9)"; ctx.fillRect(-w / 2 + 12.5, -h / 2 + 3, 1, h - 6); ctx.fillRect(w / 2 - 13.5, -h / 2 + 3, 1, h - 6);
      ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fillRect(-w / 2 + 3, -h / 2 + 1.5, w - 6, 2);
      ctx.font = `600 11px ${BODY}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff7e2";
      ctx.fillText(it.label, 0, .5);
    } else {
      ctx.fillStyle = it.gold ? "#f3c64d" : it.played ? "#cfe8d6" : "#f8f1de"; rr(-w / 2, -h / 2, w, h, 5); ctx.fill();
      ctx.fillStyle = it.played ? "#1f7a55" : "#2550b8"; ctx.font = `800 11px ${BODY}`; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText(it.played ? "✓ " + it.tag : it.tag, -w / 2 + 8, -h / 2 + 6);
      ctx.fillStyle = "#16213a"; ctx.font = `600 10.5px ${BODY}`;
      it.lines.forEach((l, i) => ctx.fillText(l, -w / 2 + 8, -h / 2 + 21 + i * 12.5));
    }
    if (hot) { ctx.strokeStyle = CHALK; ctx.lineWidth = 2.5; rr(-w / 2 - 1, -h / 2 - 1, w + 2, h + 2, 5); ctx.stroke(); }
    ctx.restore();
  }
  function drawOpenBook() {
    const bk = cur.book; if (!bk) return;
    const w = bk.w, o = bk.open, shaking = T < bk.shake;
    ctx.save(); ctx.translate(bk.x, bk.y + (shaking && !reduce ? Math.sin(T / 38) * 3 : 0)); ctx.rotate(bk.a + (shaking && !reduce ? Math.sin(T / 60) * .05 : 0));
    if (o <= 0) { const h = Math.max(26, w * .2);
      ctx.fillStyle = `hsl(${bk.hue} 44% 40%)`; rr(-w / 2, -h / 2, w, h, 4); ctx.fill(); ctx.restore(); return; }
    const h = w * .34 * o + 26 * (1 - o);
    const g = ctx.createRadialGradient(0, 0, 10, 0, 0, w * .9); g.addColorStop(0, `rgba(255,214,140,${.35 * o})`); g.addColorStop(1, "rgba(255,214,140,0)");
    ctx.fillStyle = g; ctx.fillRect(-w, -w, w * 2, w * 2);
    ctx.fillStyle = `hsl(${bk.hue} 46% 30%)`; rr(-w / 2 - 5, -h / 2 - 2, w + 10, h + 9, 6); ctx.fill();
    for (const s of [-1, 1]) { // two pages, curling up from the spine
      ctx.fillStyle = s < 0 ? "#f8f1de" : "#f2e9d0";
      ctx.beginPath(); ctx.moveTo(0, -h / 2 + 6); ctx.quadraticCurveTo(s * w * .22, -h / 2 - 8 * o, s * w / 2, -h / 2 + 2);
      ctx.lineTo(s * w / 2, h / 2); ctx.quadraticCurveTo(s * w * .22, h / 2 - 10 * o, 0, h / 2 + 4); ctx.fill();
    }
    const sg = ctx.createLinearGradient(-14, 0, 14, 0); sg.addColorStop(0, "rgba(0,0,0,0)"); sg.addColorStop(.5, "rgba(0,0,0,.22)"); sg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sg; ctx.fillRect(-14, -h / 2, 28, h + 4);
    if (o > .9 && w > 180) {
      ctx.fillStyle = "#16213a"; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.font = `800 12px ${DISPLAY}`;
      wrap(bk.title, w * .4, 4).forEach((l, i) => ctx.fillText(l, -w * .26, -h / 2 + 14 + i * 14));
      const L = cur.lectures; ctx.font = `800 30px ${DISPLAY}`; ctx.fillStyle = "#2550b8";
      ctx.fillText(L ? (L.length ? num(L.length) : "↗") : "…", w * .26, -h / 2 + 16);
      ctx.font = `600 11px ${BODY}`; ctx.fillStyle = "#5a6582"; ctx.fillText(L && !L.length ? "course page" : "lectures inside", w * .26, -h / 2 + 52);
    }
    ctx.restore();
  }

  // ---------- main loop ----------
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    if (state === "street" || state === "load") { cam.z = streetZ(); cam.gy = streetGy(); }
    else if (state === "hall" || state === "book") { cam.z = hallDoorH() / cur.u.doorH; cam.gy = hallGy(); if (cur.book && cur.book.ready) { cur.book.x = W / 2; cur.book.y = bookY(); } }
    placeWalls();
  }
  addEventListener("resize", resize);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now; T = now;
    for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i], t = clamp((now - tw.t0) / tw.ms, 0, 1); tw.fn(t); if (t >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
    if (state === "street" && !p.down && Math.abs(panVel) > .05) { cam.x = clamp(cam.x + panVel * dt / 16.7, 0, streetW); panVel *= Math.pow(.93, dt / 16.7); }
    if (engine) {
      while (spawnQ.length && spawnQ[0].at <= T) spawn(spawnQ.shift());
      Engine.update(engine, 1000 / 60);
      if (bodies.some((b) => b.position.y > H + 400)) { bodies = bodies.filter((b) => { if (b.position.y > H + 400) { Composite.remove(engine.world, b); return false; } return true; }); }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky();
    if (unis.length) {
      drawStreet(); drawSteps();
      if (state === "book") { ctx.fillStyle = "rgba(8,10,30,.5)"; ctx.fillRect(0, 0, W, H); }
      for (const b of bodies) if (b.item.falling) drawBody(b);
      drawOpenBook();
      for (const b of bodies) if (!b.item.falling) drawBody(b);
    }
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) document.fonts.load(`800 13px ${DISPLAY}`).catch(() => {});
  fetch("courses.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(init)
    .catch(() => { $("sub").textContent = "The catalogue could not load. Check your connection and refresh the page."; });
})();
</script>
